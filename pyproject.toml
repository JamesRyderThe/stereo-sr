[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stereo-sr"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.10,<2.11",
    "torchvision",
    "numpy",
    "Pillow",
    "timm>=1.0.25",
    "einops>=0.8.2",
    "scipy>=1.15.3",
    "huggingface-hub>=1.7.1",
    "gdown>=5.2.1",
    "trimesh>=4.11.3",
    "imageio>=2.37.3",
    "joblib>=1.5.3",
    "pydantic>=2.12.5",
    "pyyaml>=6.0",
    "accelerate>=1.13.0",
    "wandb>=0.25.1",
    "tqdm>=4.67.3",
    "python-dotenv>=1.2.2",
    "boto3>=1.42.73",
    "setuptools",
    "rich>=14.3.3",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.0",
    "ruff>=0.4",
    "pytest>=8.0",
    "types-pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sissr"]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
packages = ["sissr"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "torchvision.*",
    "matplotlib.*",
    "PIL.*",
    "accelerate.*",
    "wandb.*",
    "tqdm.*",
    "boto3.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sissr.baselines.*"
disable_error_code = ["misc", "untyped-decorator"]

[tool.ruff]
src = ["src", "scripts", "tests"]
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--no-header", "-rN"]
minversion = "8.0"
